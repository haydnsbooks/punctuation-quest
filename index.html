<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Punctuation Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#10132B; --navy2:#191D42; --cream:#FFFBF2; --ink:#1B1F3B;
    --gold:#F4B942; --good:#3FAE72; --bad:#E85D5D; --accent:#3E6FF2; --accent2:#FFC93C;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Nunito',sans-serif;
    background:
      radial-gradient(1.5px 1.5px at 10% 20%, rgba(255,255,255,.5) 0, transparent 40%),
      radial-gradient(1.5px 1.5px at 80% 10%, rgba(255,255,255,.4) 0, transparent 40%),
      radial-gradient(1.5px 1.5px at 60% 70%, rgba(255,255,255,.35) 0, transparent 40%),
      radial-gradient(1.5px 1.5px at 30% 85%, rgba(255,255,255,.4) 0, transparent 40%),
      radial-gradient(1.5px 1.5px at 90% 60%, rgba(255,255,255,.3) 0, transparent 40%),
      linear-gradient(160deg,var(--navy),var(--navy2));
    background-attachment:fixed;
    min-height:100%; color:var(--ink); -webkit-user-select:none; user-select:none;
  }
  input,textarea{-webkit-user-select:text;user-select:text;}
  h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;}
  #app{max-width:920px;margin:0 auto;padding:20px 16px 60px;min-height:100vh;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .brand{display:flex;align-items:center;gap:10px;color:var(--cream);}
  .brand .logo{font-size:28px;}
  .brand h1{font-size:22px;margin:0;color:var(--cream);letter-spacing:.3px;}
  .brand small{display:block;color:#B9BEE8;font-weight:600;font-size:12px;letter-spacing:.5px;}
  .homebtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:var(--cream);
    font-family:'Nunito',sans-serif;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer;font-size:14px;}
  .homebtn:active{transform:scale(.96);}

  .statusbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .trophybar{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:var(--cream);
    border-radius:999px;padding:8px 16px;font-weight:800;font-size:13.5px;font-family:'Baloo 2',sans-serif;}
  .playerchip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#E7E9FF;
    border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .playerchip button{background:none;border:none;color:var(--gold);font-weight:800;cursor:pointer;font-size:13px;font-family:'Nunito',sans-serif;text-decoration:underline;padding:0;}

  .levelgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:10px;}
  .levelcard{position:relative;border-radius:20px;padding:14px 12px 12px;cursor:pointer;border:none;text-align:left;
    color:var(--cream);min-height:158px;display:flex;flex-direction:column;justify-content:space-between;
    box-shadow:0 10px 22px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.12);transition:transform .12s ease;}
  .levelcard:active{transform:scale(.97);}
  .levelcard .num{position:absolute;top:9px;right:11px;font-family:'Baloo 2',sans-serif;font-size:11px;font-weight:700;
    background:rgba(0,0,0,.28);padding:3px 8px;border-radius:999px;}
  .levelcard .icon{font-size:30px;}
  .levelcard .lname{font-family:'Baloo 2',sans-serif;font-size:16px;font-weight:700;margin-top:4px;line-height:1.15;}
  .levelcard .lfocus{font-size:11px;opacity:.92;margin-top:2px;font-weight:600;line-height:1.3;}
  .levelcard .best{margin-top:8px;font-size:11.5px;font-weight:800;background:rgba(255,255,255,.16);
    display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;width:fit-content;}
  .kindtag{position:absolute;top:9px;left:11px;font-size:9.5px;font-weight:800;text-transform:uppercase;
    letter-spacing:.4px;background:rgba(0,0,0,.28);padding:3px 7px;border-radius:999px;}

  .intro-banner{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#E7E9FF;
    border-radius:16px;padding:14px 16px;font-size:13.5px;line-height:1.5;margin-bottom:6px;}
  .warn-banner{background:rgba(232,93,93,.15);border:1px solid rgba(232,93,93,.4);color:#FFD9D9;
    border-radius:14px;padding:10px 14px;font-size:12.5px;line-height:1.5;margin-bottom:14px;font-weight:600;}

  .card{background:var(--cream);border-radius:22px;padding:22px 20px 24px;box-shadow:0 14px 30px rgba(0,0,0,.35);}
  .themebar{display:flex;align-items:center;gap:12px;color:#fff;border-radius:18px;padding:14px 16px;
    margin-bottom:16px;box-shadow:0 8px 18px rgba(0,0,0,.3);}
  .themebar .icon{font-size:30px;}
  .themebar h2{margin:0;font-size:19px;}
  .themebar span{display:block;font-size:12px;font-weight:700;opacity:.9;}

  .rulebox{background:#FFF3DA;border-left:6px solid var(--gold);border-radius:12px;padding:12px 14px;
    font-size:14.5px;line-height:1.5;margin-bottom:14px;font-weight:600;}
  .recapbox{background:#EFEBFA;border-left:6px solid #7C4DFF;border-radius:12px;padding:12px 14px;
    font-size:13.5px;line-height:1.6;margin-bottom:16px;font-weight:600;}
  .recapbox ul{margin:6px 0 0;padding-left:18px;}
  .recapbox li{margin-bottom:4px;}

  .examples{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
  .ex{border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.4;display:flex;gap:10px;align-items:flex-start;}
  .ex.good{background:#E9F8EF;border:1.5px solid var(--good);}
  .ex.bad{background:#FCEBEB;border:1.5px solid var(--bad);}
  .ex .tag{font-weight:800;font-size:12px;flex-shrink:0;padding:2px 8px;border-radius:999px;color:#fff;margin-top:1px;}
  .ex.good .tag{background:var(--good);}
  .ex.bad .tag{background:var(--bad);}
  .ex mark{background:transparent;color:var(--accent);font-weight:800;padding:0;}
  .ex .note{display:block;font-size:12px;opacity:.7;margin-top:3px;font-weight:600;}

  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
  .btn{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:16px;border:none;border-radius:14px;
    padding:14px 22px;cursor:pointer;color:#fff;box-shadow:0 6px 14px rgba(0,0,0,.2);}
  .btn:active{transform:scale(.97);}
  .btn.secondary{background:#fff;color:var(--ink);border:2px solid #E3E1D8;box-shadow:none;}
  .btn.wide{width:100%;text-align:center;}
  .btn:disabled{opacity:.45;cursor:default;}

  .progresswrap{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .progressbar{flex:1;height:10px;background:#EDEAE0;border-radius:999px;overflow:hidden;}
  .progressfill{height:100%;border-radius:999px;transition:width .3s ease;}
  .qcount{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:13px;color:#666;white-space:nowrap;}
  .qtype{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
    color:#fff;padding:3px 10px;border-radius:999px;margin-bottom:10px;}
  .qprompt{font-size:16.5px;font-weight:700;line-height:1.4;margin-bottom:14px;}
  .sentence-box{background:#F5F3EA;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:700;
    line-height:1.5;margin-bottom:16px;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .option{text-align:left;background:#fff;border:2px solid #E3E1D8;border-radius:12px;padding:13px 14px;
    font-size:15.5px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;line-height:1.4;}
  .option:active{transform:scale(.98);}
  .option.correct{background:#E9F8EF;border-color:var(--good);color:#1c6b3d;}
  .option.wrong{background:#FCEBEB;border-color:var(--bad);color:#a12f2f;}
  .option[disabled]{cursor:default;}

  .retype-input{width:100%;font-family:'Nunito',sans-serif;font-weight:700;font-size:16px;padding:14px 14px;
    border-radius:12px;border:2px solid #E3E1D8;margin-bottom:14px;background:#fff;color:var(--ink);}
  .retype-input:focus{outline:none;border-color:var(--accent);}
  .retype-input.correct{border-color:var(--good);background:#E9F8EF;}
  .retype-input.wrong{border-color:var(--bad);background:#FCEBEB;}

  .feedback{border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.5;margin-bottom:14px;font-weight:600;}
  .feedback.correct{background:#E9F8EF;color:#1c6b3d;border:1.5px solid var(--good);}
  .feedback.wrong{background:#FCEBEB;color:#a12f2f;border:1.5px solid var(--bad);}
  .feedback .answer{display:block;margin-top:6px;font-weight:800;}
  .hintlink{background:none;border:none;color:#8a7f5a;font-weight:700;font-size:13px;text-decoration:underline;
    cursor:pointer;padding:0 0 12px;font-family:'Nunito',sans-serif;}

  .resultwrap{text-align:center;}
  .tieremoji{font-size:56px;line-height:1;margin-bottom:6px;}
  .tiertitle{font-size:24px;margin:4px 0 2px;}
  .scoreline{font-family:'Baloo 2',sans-serif;font-weight:700;color:#666;font-size:15px;margin-bottom:6px;}
  .syncline{font-size:12px;font-weight:700;color:#888;margin-bottom:14px;}
  .tiermsg{font-size:14.5px;color:#555;margin-bottom:18px;line-height:1.5;}
  .allTiers{margin-top:22px;text-align:left;background:#F5F3EA;border-radius:14px;padding:14px 16px;}
  .allTiers h4{margin:0 0 8px;font-size:13px;color:#777;text-transform:uppercase;letter-spacing:.4px;}
  .tierrow{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0;font-weight:700;color:#666;}
  .tierrow.active{color:var(--ink);}
  .tierrow .em{margin-right:6px;}

  .namewrap{text-align:center;padding:10px 4px;}
  .namewrap .bigicon{font-size:46px;margin-bottom:6px;}
  .namewrap p{font-size:14px;color:#555;line-height:1.5;margin-bottom:16px;}
  .namewrap input{width:100%;max-width:320px;}
  .loadwrap{text-align:center;padding:60px 10px;color:var(--cream);font-family:'Baloo 2',sans-serif;font-size:16px;}

  footer.credits{text-align:center;color:#7C82B8;font-size:11.5px;margin-top:30px;line-height:1.6;}

  @media (max-width:480px){ .levelgrid{grid-template-columns:repeat(2,1fr);} .brand h1{font-size:18px;} }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   PUNCTUATION QUEST v2 — 15 levels, elemental themes,
   global badge ladder, optional Google Sheets cloud sync
   ========================================================= */

/* ---- CONFIG: paste your deployed Google Apps Script Web App URL here ---- */
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbxqf4FzafjHPVyqwgcAsVXVcdsSfotBmzKszT5JgHtW83b8ZXkB-JXn9crsu0U3pwjl/exec"   // e.g. "https://script.google.com/macros/s/AKfycb.../exec"  — leave blank to play without cloud sync
};

/* ---------------- skill metadata ---------------- */
const SKILL_META = {
  A:{title:"Full stops & capitals"},
  B:{title:"Question & exclamation marks"},
  C:{title:"Commas in lists"},
  D:{title:"Apostrophes (contractions)"},
  E:{title:"Apostrophes (possession)"},
  F:{title:"Commas for clauses"},
  G:{title:"Dialogue: speaker named first"},
  H:{title:"Dialogue: speech comes first"},
  I:{title:"Dialogue: split by the speaker"}
};
const RULES = {
  A:"Every sentence starts with a <b>capital letter</b> and ends with a <b>full stop</b>. Capital letters are also used for the names of people, places, days and months.",
  B:"A <b>question mark (?)</b> ends a sentence that asks something. An <b>exclamation mark (!)</b> ends a sentence with strong feeling, shock or a command.",
  C:"Use <b>commas</b> to separate items in a list of three or more. Don't put a comma right before the word 'and' that joins the last two items.",
  D:"An apostrophe can show a <b>contraction</b> — two words joined into one, with the apostrophe replacing the missing letters (it is → it's).",
  E:"An apostrophe can show <b>possession</b>. One owner: add <b>'s</b> (the dog's bone). More than one owner: add the apostrophe <b>after</b> the s (the dogs' bones).",
  F:"Add a <b>comma after an opening phrase</b> at the start of a sentence. Use a <b>pair of commas</b> to fence off extra information dropped into the middle of a sentence.",
  G:"When the speaker is named <b>first</b>, add a comma after the reporting clause, then open speech marks with a <b>capital letter</b> — keep the end punctuation <b>inside</b> the closing speech marks.",
  H:"When the spoken words come <b>first</b>, keep them inside speech marks starting with a capital, with the punctuation inside the closing speech marks — then name the speaker afterwards in lower case.",
  I:"When the reporting clause <b>splits</b> the speech, use a comma before and after it. If the second part continues the same sentence, start it with a <b>lower-case</b> letter; if it's a new sentence, use a full stop after the tag and a capital letter."
};
const RULES_SHORT = {
  A:"Full stops end sentences; capitals start them and name people, places, days, months.",
  B:"? ends a question; ! ends strong feeling, shock or a command.",
  C:"Commas separate list items (no comma right before the final 'and').",
  D:"Apostrophes replace missing letters in a contraction (it's, don't).",
  E:"Apostrophes show ownership: 's for one owner, s' for more than one.",
  F:"A comma follows an opening phrase; a pair of commas fences off the extra bit in the middle.",
  G:"Speaker first: comma, then speech marks with a capital — punctuation stays inside.",
  H:"Speech first: capital & punctuation inside the speech marks, then the speaker in lower case.",
  I:"Split speech: commas around the middle tag; capital only if the second part is a new sentence."
};

/* ---------------- question pools (5 MC + 5 retype per skill) ---------------- */
const POOLS = {
A:{
  mc:[
    {type:"mc",prompt:"Which sentence is correctly punctuated?",
      options:[`the shuttle landed safely.`,`The shuttle landed safely`,`The shuttle Landed safely.`,`The shuttle landed safely.`],
      correct:3, explain:"Sentences start with a capital letter and end with a full stop — no capitals in the middle."},
    {type:"mc",prompt:"Which sentence is correctly punctuated?",
      options:[`saturn has beautiful rings.`,`Saturn has beautiful rings`,`Saturn Has beautiful rings.`,`Saturn has beautiful rings.`],
      correct:3, explain:"'Saturn' needs a capital as it starts the sentence, and it needs a full stop at the end."},
    {type:"mc",prompt:"Which sentence is correctly punctuated?",
      options:[`The Gravity Discovery Centre is in western Australia.`,`the Gravity discovery centre is in Western Australia.`,`The Gravity Discovery Centre is in Western Australia.`,`The gravity discovery Centre is in Western Australia.`],
      correct:2, explain:"Every word in the name of a place needs a capital letter."},
    {type:"mc",prompt:"Which sentence is correctly punctuated?",
      options:[`She watched the meteor shower every night in July.`,`she watched the meteor shower every night in July.`,`She watched the meteor shower every night in july.`,`She Watched the meteor shower every night in July.`],
      correct:0, explain:"'She' starts the sentence and 'July' is a month — both need capitals, nothing else does."},
    {type:"mc",prompt:"Which sentence uses full stops correctly?",
      options:[`The rocket launched, it reached orbit in eight minutes.`,`The rocket launched it reached orbit in eight minutes.`,`The rocket launched. It reached orbit in eight minutes.`,`The rocket Launched. it reached orbit in eight minutes.`],
      correct:2, explain:"Two separate ideas need a full stop between them, and the next sentence starts with a capital."}
  ],
  retype:[
    {type:"retype",incorrect:`the international space station orbits earth every 90 minutes`,
      correct:`The International Space Station orbits Earth every 90 minutes.`,
      hint:"Check the start of the sentence, the name of the station, the planet name, and the end."},
    {type:"retype",incorrect:`buzz aldrin was the second man to walk on the moon`,
      correct:`Buzz Aldrin was the second man to walk on the Moon.`,
      hint:"Buzz Aldrin is a person's name. The Moon is a specific place."},
    {type:"retype",incorrect:`the perth observatory hosts stargazing nights on fridays`,
      correct:`The Perth Observatory hosts stargazing nights on Fridays.`,
      hint:"Perth Observatory is a place name. Fridays is a day."},
    {type:"retype",incorrect:`jupiter is the largest planet in our solar system`,
      correct:`Jupiter is the largest planet in our solar system.`,
      hint:"Only the planet name and the first word need a capital."},
    {type:"retype",incorrect:`astronauts must train for many years before their first mission`,
      correct:`Astronauts must train for many years before their first mission.`,
      hint:"No names here — just the start of the sentence and the full stop."}
  ]
},
B:{
  mc:[
    {type:"mc",prompt:"Which sentence needs a question mark?",
      options:[`Where did the thief hide the jewels?`,`Where did the thief hide the jewels.`,`Where did the thief hide the jewels!`,`where did the thief hide the jewels?`],
      correct:0, explain:"It's asking something, and it starts with a capital letter."},
    {type:"mc",prompt:"Which sentence correctly shows strong feeling?",
      options:[`Stop right there, thief.`,`Stop right there, thief!`,`Stop right there, thief?`,`stop right there, thief!`],
      correct:1, explain:"A command shouted with urgency needs an exclamation mark."},
    {type:"mc",prompt:"Which sentence is correctly punctuated?",
      options:[`Have you found any fingerprints.`,`Have you found any fingerprints?`,`Have you found any fingerprints!`,`have you found any fingerprints?`],
      correct:1, explain:"This is a question, so it needs a question mark and a capital letter to start."},
    {type:"mc",prompt:"Which sentence is a statement, not a question?",
      options:[`Is the safe locked?`,`The safe is locked.`,`The safe is locked?`,`Locked is the safe?`],
      correct:1, explain:"It simply tells us a fact, so it ends with a full stop."},
    {type:"mc",prompt:"Which sentence uses the exclamation mark correctly?",
      options:[`I can't believe we solved the case!`,`I can't believe we solved the case.`,`I can't believe we solved the case?`,`i can't believe we solved the case!`],
      correct:0, explain:"Strong surprise needs an exclamation mark, and the sentence must start with a capital."}
  ],
  retype:[
    {type:"retype",incorrect:`have you seen this suspect before`,
      correct:`Have you seen this suspect before?`, hint:"This sentence is asking something."},
    {type:"retype",incorrect:`Run the building is on fire`,
      correct:`Run! The building is on fire!`, hint:"There are two urgent commands — each needs its own exclamation mark and capital."},
    {type:"retype",incorrect:`why did the window break`,
      correct:`Why did the window break?`, hint:"This sentence is asking something."},
    {type:"retype",incorrect:`the detective solved the mystery in one hour`,
      correct:`The detective solved the mystery in one hour.`, hint:"This is a calm statement."},
    {type:"retype",incorrect:`Watch out for the trap door`,
      correct:`Watch out for the trap door!`, hint:"This is an urgent warning."}
  ]
},
C:{
  mc:[
    {type:"mc",prompt:"Which sentence uses commas correctly in a list?",
      options:[`The chef added salt pepper and garlic.`,`The chef added salt, pepper and, garlic.`,`The chef added salt, pepper and garlic.`,`The chef, added salt pepper and garlic.`],
      correct:2, explain:"A comma after each item except the last two, which are joined by 'and'."},
    {type:"mc",prompt:"Which sentence uses commas correctly in a list?",
      options:[`We need eggs, flour, milk and sugar.`,`We need eggs flour, milk and sugar.`,`We need eggs, flour milk, and sugar.`,`We need eggs, flour, milk, and, sugar.`],
      correct:0, explain:"Every item needs a comma except the final two joined by 'and'."},
    {type:"mc",prompt:"Which sentence uses commas correctly in a list?",
      options:[`The recipe uses basil, oregano and thyme.`,`The recipe uses basil oregano and thyme.`,`The recipe uses basil, oregano, and, thyme.`,`The recipe, uses basil oregano and thyme.`],
      correct:0, explain:"Commas separate each item; none is needed right before 'and'."},
    {type:"mc",prompt:"Which sentence is MISSING its commas?",
      options:[`She packed apples bananas and grapes for the picnic.`,`She packed apples, bananas and grapes for the picnic.`,`She, packed apples, bananas and grapes for the picnic.`,`She packed apples, bananas, and, grapes for the picnic.`],
      correct:0, explain:"This list has no commas at all between the items."},
    {type:"mc",prompt:"Which sentence uses commas correctly?",
      options:[`The judges tasted the soup, salad and dessert.`,`The judges tasted the soup salad and dessert.`,`The judges, tasted the soup, salad and dessert.`,`The judges tasted the soup, salad, and, dessert.`],
      correct:0, explain:"A comma after each item except the final two joined by 'and'."}
  ],
  retype:[
    {type:"retype",incorrect:`the fruit bowl had apples oranges and bananas`,
      correct:`The fruit bowl had apples, oranges and bananas.`, hint:"There are three items in this list."},
    {type:"retype",incorrect:`pack a hat sunscreen and water for the excursion`,
      correct:`Pack a hat, sunscreen and water for the excursion.`, hint:"There are three items in this list."},
    {type:"retype",incorrect:`the shopping list included milk bread cheese and eggs`,
      correct:`The shopping list included milk, bread, cheese and eggs.`, hint:"There are four items in this list."},
    {type:"retype",incorrect:`my favourite sports are swimming football and cricket`,
      correct:`My favourite sports are swimming, football and cricket.`, hint:"There are three items in this list."},
    {type:"retype",incorrect:`the garden grew tomatoes carrots and lettuce`,
      correct:`The garden grew tomatoes, carrots and lettuce.`, hint:"There are three items in this list."}
  ]
},
D:{
  mc:[
    {type:"mc",prompt:"Which sentence uses the apostrophe correctly?",
      options:[`Its snowing.`,`It's snowing.`,`Its' snowing.`,`I'ts snowing.`],
      correct:1, explain:"'It's' is short for 'it is' — the apostrophe replaces the missing letter."},
    {type:"mc",prompt:"Which is the correct way to write 'do not'?",
      options:[`We dont like the cold.`,`We don't like the cold.`,`We do'nt like the cold.`,`We don't' like the cold.`],
      correct:1, explain:"The apostrophe replaces the missing 'o' in 'not'."},
    {type:"mc",prompt:"Which sentence uses the apostrophe correctly?",
      options:[`Lets go outside.`,`Let's go outside.`,`Le'ts go outside.`,`Lets' go outside.`],
      correct:1, explain:"'Let's' is short for 'let us'."},
    {type:"mc",prompt:"Which sentence uses the apostrophe correctly?",
      options:[`Theyre going to the park.`,`They're going to the park.`,`The'yre going to the park.`,`Theyr'e going to the park.`],
      correct:1, explain:"'They're' is short for 'they are'."},
    {type:"mc",prompt:"Which sentence uses the apostrophe correctly?",
      options:[`I cant find my shoes.`,`I can't find my shoes.`,`I ca'nt find my shoes.`,`I cant' find my shoes.`],
      correct:1, explain:"'Can't' is short for 'cannot'."}
  ],
  retype:[
    {type:"retype",incorrect:`im going to the shop`,
      correct:`I'm going to the shop.`, hint:"'I'm' is short for 'I am'."},
    {type:"retype",incorrect:`shes not coming today`,
      correct:`She's not coming today.`, hint:"'She's' is short for 'she is'."},
    {type:"retype",incorrect:`youre going to love this`,
      correct:`You're going to love this.`, hint:"'You're' is short for 'you are'."},

      id:def.id, kind:"single", skill:def.skill, theme,
      focus:SKILL_META[def.skill].title,

function normalize(s){
  return s.replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/\s+/g," ").trim();
}

/* ---------------- cloud sync ---------------- */
async function fetchProgress(name){
  if(!CONFIG.API_URL) return {ok:true, progress:{}};
  try{
    const res = await fetch(`${CONFIG.API_URL}?action=getProgress&name=${encodeURIComponent(name)}`);
    const data = await res.json();
    return {ok:true, progress:data.progress||{}};
  }catch(e){
    return {ok:false, progress:{}};
  }
}
async function saveProgressRemote(name, levelId, score, badgeTitle){
  if(!CONFIG.API_URL) return true;
  try{
    await fetch(`${CONFIG.API_URL}?action=saveScore&name=${encodeURIComponent(name)}&levelId=${levelId}&score=${score}&badge=${encodeURIComponent(badgeTitle||"")}`);
    return true;
  }catch(e){
    return false;
  }
}

function renderNameGate(){
  app.innerHTML = `
    ${topbar(false)}
    <div class="card namewrap">
      <div class="bigicon">✒️🔥❄️💧</div>
      <h2>Who's playing?</h2>
      <p>Type your name to start (or pick up where you left off). ${CONFIG.API_URL? "Your badges are saved to your class score sheet." : "Ask your teacher if this game is set up to save your badges yet."}</p>
      <input type="text" id="nameInput" class="retype-input" placeholder="e.g. Jamie" autocapitalize="words" autocorrect="off" spellcheck="false"
        onkeydown="if(event.key==='Enter'){submitName();}">
      <div class="btnrow" style="justify-content:center;">
        <button class="btn" style="background:#3E6FF2" onclick="submitName()">Start my quest →</button>
      </div>
    </div>
  `;
  document.getElementById("nameInput").focus();
}

async function submitName(){
  const val = (document.getElementById("nameInput").value||"").trim();
  if(!val) return;
  state.studentName = val;
  state.screen="loading";
  render();
  const result = await fetchProgress(val);
  bestScores = {};
  Object.keys(result.progress).forEach(levelId=>{
    bestScores[Number(levelId)] = Number(result.progress[levelId].score);
  });
  state.syncWarning = CONFIG.API_URL && !result.ok;
  state.screen="menu";
  render();
}

function renderLoading(){
  app.innerHTML = `${topbar(false)}<div class="loadwrap">Loading your badges… ⏳</div>`;
}

function changePlayer(){
  state.screen="name";
  state.studentName="";
  bestScores={};
  render();
}

function renderMenu(){
  const fremantiumCount = Object.values(bestScores).filter(s=>s===10).length;
  const cards = LEVELS.map(l=>{
    const best = bestScores[l.id];
    const badge = best!==undefined ? getBadge(best) : null;
    return `
    <button class="levelcard" style="background:${l.theme.bg}" onclick="openLevel(${l.id})">
      <div class="kindtag">${l.kind==="combo"?"Combo":"Level "+l.id}</div>
      <div class="num">${l.theme.name}</div>
      <div>
        <div class="icon">${l.theme.icon}</div>
        <div class="lname">Level ${l.id}</div>
        <div class="lfocus">${l.focus}</div>
      </div>
      ${badge ? `<div class="best">${badge.emoji} ${badge.title} (${best}/10)</div>` : `<div class="best" style="opacity:.75">Not played yet</div>`}
    </button>`;
  }).join("");

  app.innerHTML = `
    ${topbar(false)}
    <div class="statusbar">
      <div class="playerchip">👋 Playing as <b>${state.studentName}</b> <button onclick="changePlayer()">Change</button></div>
      <div class="trophybar">⚓ Fremantium badges: ${fremantiumCount} / 15</div>
    </div>
    ${state.syncWarning ? `<div class="warn-banner">⚠️ Couldn't reach the class score sheet — playing offline this session. Badges earned now will try to sync again next time you enter your name with a connection.</div>` : ""}
    <div class="intro-banner">Welcome, word wizard! Choose a level below. Single-skill levels teach one rule; combo levels mix in everything you've learned so far. Score well to climb the badge ladder: Tin → Bronze → Iron → Steel → Silver → Gold → Platinum → Adamantite → Churchlandium → Fremantium.</div>
    <div class="levelgrid">${cards}</div>
    <footer class="credits">Punctuation Quest &middot; built for classroom practice</footer>
  `;
}

function openLevel(id){ state.levelId=id; state.screen="learn"; render(); window.scrollTo(0,0); }
function goMenu(){ state.screen="menu"; render(); window.scrollTo(0,0); }

function renderLearn(){
  const level = getLevel(state.levelId);
  let bodyHtml = "";
  if(level.kind==="single"){
    const exHtml = level.examples.map(ex=>`
      <div class="ex good"><span class="tag">✓ CORRECT</span><span>${ex.good}</span></div>
      <div class="ex bad"><span class="tag">✗ INCORRECT</span><span>${ex.bad}<span class="note">${ex.note}</span></span></div>
    `).join("");
    bodyHtml = `
      <div class="rulebox">📘 <b>The rule:</b> ${level.rule}</div>
      <div class="examples">${exHtml}</div>
    `;
  } else {
    const items = level.skills.map(s=>`<li><b>${SKILL_META[s].title}:</b> ${RULES_SHORT[s]}</li>`).join("");
    bodyHtml = `<div class="recapbox">🧩 <b>This level mixes:</b><ul>${items}</ul></div>`;
  }
  app.innerHTML = `
    ${topbar(true)}
    <div class="card">
      <div class="themebar" style="background:${level.theme.bg}">
        <div class="icon">${level.theme.icon}</div>
        <div><h2>${level.theme.name}</h2><span>LEVEL ${level.id} &middot; ${level.focus}</span></div>
      </div>
      ${bodyHtml}
      <div class="btnrow">
        <button class="btn wide" style="background:${level.theme.accent}" onclick="startQuiz()">Start the 10-question challenge →</button>
      </div>
    </div>
  `;
}

function startQuiz(){ state.screen="quiz"; state.qIndex=0; state.score=0; state.answered=false; render(); window.scrollTo(0,0); }

function renderQuiz(){
  const level = getLevel(state.levelId);
  const q = level.questions[state.qIndex];
  const pct = Math.round((state.qIndex)/level.questions.length*100);
  const typeLabel = q.type==="mc" ? "Multiple choice" : "Fix it — retype correctly";
  const typeColor = q.type==="mc" ? level.theme.accent : "#B0562E";

  let bodyHtml = "";
  if(q.type==="mc"){
    const opts = q.options.map((opt,i)=>`<button class="option" id="opt-${i}" onclick="answerMC(${i})">${opt}</button>`).join("");
    bodyHtml = `<div class="qprompt">${q.prompt}</div><div class="options" id="optionsWrap">${opts}</div><div id="feedbackWrap"></div>`;
  } else {
    bodyHtml = `
      <div class="qprompt">Retype this sentence with the correct punctuation:</div>
      <div class="sentence-box">${q.incorrect}</div>
      <input type="text" class="retype-input" id="retypeInput" placeholder="Type the corrected sentence here"
        autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off"
        onkeydown="if(event.key==='Enter'){answerRetype();}">
      <div id="feedbackWrap"></div>
      <div id="hintWrap"><button class="hintlink" onclick="showHint()">💡 Need a hint?</button></div>
      <div class="btnrow" id="checkRow"><button class="btn" style="background:${level.theme.accent}" id="checkBtn" onclick="answerRetype()">Check answer</button></div>
    `;
  }
  app.innerHTML = `
    ${topbar(true)}
    <div class="card">
      <div class="progresswrap">
        <div class="progressbar"><div class="progressfill" style="width:${pct}%;background:${level.theme.accent}"></div></div>
        <div class="qcount">Q${state.qIndex+1}/${level.questions.length}</div>
      </div>
      <span class="qtype" style="background:${typeColor}">${typeLabel}</span>
      ${bodyHtml}
      <div class="btnrow" id="nextRow"></div>
    </div>
  `;
}

function lockOptions(){ document.querySelectorAll(".option").forEach(b=>b.disabled=true); }

function answerMC(i){
  if(state.answered) return;
  state.answered = true;
  const level = getLevel(state.levelId);
  const q = level.questions[state.qIndex];
  lockOptions();
  const chosen = document.getElementById("opt-"+i);
  const correctBtn = document.getElementById("opt-"+q.correct);
  const isCorrect = i===q.correct;
  if(isCorrect){ chosen.classList.add("correct"); state.score++; }
  else { chosen.classList.add("wrong"); correctBtn.classList.add("correct"); }
  document.getElementById("feedbackWrap").innerHTML = `<div class="feedback ${isCorrect?'correct':'wrong'}">${isCorrect? "✅ Correct! " : "❌ Not quite. "}${q.explain}</div>`;
  showNextButton();
}

function showHint(){
  const level = getLevel(state.levelId);
  const q = level.questions[state.qIndex];
  document.getElementById("hintWrap").innerHTML = `<div class="feedback" style="background:#FFF3DA;border:1.5px solid #F4B942;color:#7a5c14;">💡 ${q.hint}</div>`;
}

function answerRetype(){
  if(state.answered) return;
  const level = getLevel(state.levelId);
  const q = level.questions[state.qIndex];
  const input = document.getElementById("retypeInput");
  const userVal = normalize(input.value||"");
  const correctVal = normalize(q.correct);
  const isCorrect = userVal===correctVal;
  const closeButCase = !isCorrect && userVal.toLowerCase()===correctVal.toLowerCase();

  state.answered = true;
  input.disabled = true;
  input.classList.add(isCorrect?"correct":"wrong");
  document.getElementById("checkRow").innerHTML = "";
  document.getElementById("hintWrap").innerHTML = "";
  if(isCorrect) state.score++;

  let msg = isCorrect ? "✅ Correct!" : (closeButCase ? "❌ So close — check your capital letters!" : "❌ Not quite.");
  document.getElementById("feedbackWrap").innerHTML = `<div class="feedback ${isCorrect?'correct':'wrong'}">${msg}<span class="answer">Correct answer: ${q.correct}</span></div>`;
  showNextButton();
}

function showNextButton(){
  const level = getLevel(state.levelId);
  const isLast = state.qIndex === level.questions.length-1;
  document.getElementById("nextRow").innerHTML = `<button class="btn wide" style="background:${level.theme.accent}" onclick="nextQuestion()">${isLast ? "See my result →" : "Next question →"}</button>`;
}

function nextQuestion(){
  const level = getLevel(state.levelId);
  if(state.qIndex < level.questions.length-1){
    state.qIndex++; state.answered=false; render();
  } else {
    finishLevel(level);
  }
  window.scrollTo(0,0);
}

function finishLevel(level){
  const isNewBest = bestScores[level.id]===undefined || state.score>bestScores[level.id];
  if(isNewBest) bestScores[level.id] = state.score;
  state.screen = "result";
  state.syncStatus = (isNewBest && CONFIG.API_URL) ? "saving" : "idle";
  render();
  if(isNewBest && CONFIG.API_URL){
    const badge = getBadge(state.score);
    saveProgressRemote(state.studentName, level.id, state.score, badge?badge.title:"").then(ok=>{
      state.syncStatus = ok ? "saved" : "error";
      if(state.screen==="result") render();
    });
  }
}

function renderResult(){
  const level = getLevel(state.levelId);
  const badge = getBadge(state.score);
  const stars = "⭐".repeat(Math.max(1, state.score || 0)) || "—";
  const tiersHtml = BADGES.map(b=>{
    const active = badge && b.score===badge.score;
    return `<div class="tierrow ${active?'active':''}"><span><span class="em">${b.emoji}</span>${b.title}</span><span>${b.score}/10</span></div>`;
  }).join("");
  let syncLine = "";
  if(CONFIG.API_URL){
    if(state.syncStatus==="saving") syncLine = `<div class="syncline">☁️ Saving to your class score sheet…</div>`;
    else if(state.syncStatus==="saved") syncLine = `<div class="syncline">☁️ Saved to your class score sheet.</div>`;
    else if(state.syncStatus==="error") syncLine = `<div class="syncline">⚠️ Couldn't save to the cloud this time — try again with a connection.</div>`;
  }

  app.innerHTML = `
    ${topbar(true)}
    <div class="card resultwrap">
      <div class="themebar" style="background:${level.theme.bg};justify-content:center;">
        <div class="icon">${level.theme.icon}</div>
        <div><h2>${level.theme.name} — Results</h2><span>LEVEL ${level.id} &middot; ${level.focus}</span></div>
      </div>
      <div class="tieremoji">${badge? badge.emoji : "🙈"}</div>
      <div class="tiertitle display">${badge? badge.title : "No badge yet"}</div>
      <div class="scoreline">SCORE: ${state.score} / 10</div>
      ${syncLine}
      <div class="tiermsg">${badge? "Nice work — that badge is now yours!" : "Score at least 1/10 to earn your first badge. Give it another go!"}</div>
      <div class="btnrow" style="justify-content:center;">
        <button class="btn" style="background:${level.theme.accent}" onclick="startQuiz()">🔁 Play again</button>
        <button class="btn secondary" onclick="goMenu()">🏠 Choose a level</button>
      </div>
      <div class="allTiers">
        <h4>The badge ladder</h4>
        ${tiersHtml}
      </div>
    </div>
  `;
}

render();
</script>
</body>
</html>
